name: PR 181 state bootstrap

# Retry after enabling checked .ts imports for the dependency-free Node runner.
on:
  push:
    branches:
      - agent/android-tesseract-word-span-mapping-v1
    paths:
      - ".github/workflows/pr181-state-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-tesseract-word-span-mapping-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch canonical state
        shell: python
        run: |
          from __future__ import annotations

          import json
          from pathlib import Path

          markdown_path = Path("docs/OCR_PROJECT_STATE.md")
          markdown = markdown_path.read_text(encoding="utf-8")
          old_header = """# OCR Project State & Continuity v0

          Последнее обновление: 2026-08-04, PR #180, `android-tesseract-word-boxes-v1`.

          Активный трек: `local-pii-redaction`.

          Единственный следующий шаг: `android-tesseract-word-boxes-v1`.
          """
          new_header = """# OCR Project State & Continuity v0

          Последнее обновление: 2026-08-04, PR #181, `android-tesseract-word-span-mapping-v1`.

          Активный трек: `local-pii-redaction`.

          Единственный следующий шаг: `android-tesseract-word-span-mapping-v1`.
          """
          if markdown.count(old_header) != 1:
              raise SystemExit("canonical Markdown header did not match exactly once")
          markdown = markdown.replace(old_header, new_header, 1)

          old_anchor = "## 0. Изменение PR #180"
          new_section = """## 0. Изменение PR #181

          - Добавлен Android/TypeScript mapping layer, который строит канонический request-local `sourceText` из уже валидированных Tesseract `wordBoxes` в iterator order, вставляя ровно один ASCII-пробел между словами и сохраняя value-free character spans для каждого word index.
          - Один caller-confirmed non-empty text span разрешается только через index, созданный trusted builder. Forged indexes, non-integer/negative/empty/reversed/out-of-range spans, leading/trailing separator spans, OCR words с whitespace и mapping более чем на `64` word boxes fail closed.
          - Mapping возвращает только `wordIndex`, `confidence` и defensive immutable copies исходных pixel `bbox`; OCR word text, matched PII value и source offsets в mapping output не копируются. Boxes намеренно не объединяются и candidate geometry не создаётся.
          - Iterator order является источником text order независимо от физических x-координат, поэтому synthetic RTL test подтверждает mapping составного phone-like значения на несколько раздельных boxes с убывающими x coordinates. Отдельно покрыто значение внутри punctuation-sharing word box.
          - Dependency-free mobile tests добавляют `5/5` regressions; вместе с PR #180 mobile suite составляет `9/9`. Strict TypeScript validation требует `allowImportingTsExtensions` только в существующем `noEmit`-контуре, поскольку прямой Node test runner использует точные `.ts` specifiers.
          - PR не добавляет и не портирует direct-value finder, не создаёт evidence/candidates/dispositions, не объединяет boxes, не рисует masks, не меняет UI, persistence, transport, backend, external OCR/LLM, runtime dependencies или privacy boundary и не использует реальные договоры/PII.
          - По merge-gated workflow `next_step_id` остаётся `android-tesseract-word-span-mapping-v1` до merge PR #181 и нового чтения resulting `main`; следующий bounded slice должен отдельно определить безопасную агрегацию нескольких boxes в candidate geometry.

          ### Изменение PR #180"""
          if markdown.count(old_anchor) != 1:
              raise SystemExit("PR 180 Markdown anchor did not match exactly once")
          markdown = markdown.replace(old_anchor, new_section, 1)
          markdown_path.write_text(markdown, encoding="utf-8", newline="\n")

          json_path = Path("docs/OCR_PROJECT_STATE.json")
          state = json.loads(json_path.read_text(encoding="utf-8"))
          expected = {
              "state_version": "privacy-ocr-2026-08-04-34",
              "next_step_id": "android-tesseract-word-boxes-v1",
              "last_recorded_pr": 180,
              "last_recorded_change": "android-tesseract-word-boxes-v1",
          }
          for key, value in expected.items():
              if state.get(key) != value:
                  raise SystemExit(f"unexpected canonical JSON field {key}: {state.get(key)!r}")
          state.update(
              {
                  "state_version": "privacy-ocr-2026-08-04-35",
                  "next_step_id": "android-tesseract-word-span-mapping-v1",
                  "next_step_summary": "Merge-gated: PR #181 builds a trusted canonical local word-text index and maps one caller-confirmed text span to bounded value-free Tesseract word-box references without unioning boxes or creating candidates; keep this identifier unchanged until merge and a new reading of resulting main before selecting candidate geometry aggregation.",
                  "last_recorded_pr": 181,
                  "last_recorded_change": "android-tesseract-word-span-mapping-v1",
              }
          )
          json_path.write_text(
              json.dumps(state, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
              newline="\n",
          )

      - name: Validate mobile tests and types
        working-directory: mobile
        run: |
          npm ci
          npm test
          npm run typecheck

      - name: Install repository test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r research/hebrew_contract_ocr/requirements-training.txt

      - name: Validate OCR runtime and mandatory suite
        run: |
          python -m research.hebrew_contract_ocr.training_runtime_smoke
          python -m unittest \
            tests.test_ocr_pii_annotations \
            tests.test_ocr_pii_candidate_evidence \
            tests.test_ocr_pii_direct_patterns \
            tests.test_ocr_pii_direct_value_decision_adapter \
            tests.test_ocr_pii_marker_value_relations \
            tests.test_ocr_pii_marker_value_decision_adapter \
            tests.test_ocr_pii_visual_sensitive_regions \
            tests.test_ocr_pii_visual_decision_adapter \
            tests.test_ocr_pii_evidence_decisions \
            tests.test_ocr_pii_baseline \
            tests.test_ocr_pii_mask_renderer \
            tests.test_ocr_pii_mask_diagnostics \
            tests.test_ocr_pii_reviewer_pilot \
            tests.test_ocr_pii_review_pack_builder \
            tests.test_ocr_line_segmenter \
            tests.test_ocr_recognizer_input \
            tests.test_ocr_ctc_decoder \
            tests.test_tools_run_pii_mask_diagnostics

      - name: Validate full repository suite
        run: python -m unittest discover -s tests

      - name: Commit canonical state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/OCR_PROJECT_STATE.md docs/OCR_PROJECT_STATE.json
          git diff --cached --check
          git commit -m "Record PR 181 word span mapping state"
          git push origin HEAD:agent/android-tesseract-word-span-mapping-v1
