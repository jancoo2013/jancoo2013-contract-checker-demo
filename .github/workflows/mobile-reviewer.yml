name: Mobile reviewer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "mobile/pii-reviewer/**"
      - ".github/workflows/mobile-reviewer.yml"
  push:
    branches: [main]
    paths:
      - "mobile/pii-reviewer/**"
      - ".github/workflows/mobile-reviewer.yml"

permissions:
  contents: read

jobs:
  android-js:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile/pii-reviewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npx expo export --platform android --output-dir dist
      - name: Generate native Android project
        run: CI=1 npx expo prebuild --platform android --clean
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease
      - name: Record standalone APK identity
        run: |
          set -euo pipefail
          mkdir -p build-artifact
          cp android/app/build/outputs/apk/release/app-release.apk build-artifact/PII-Pilot-V2.apk
          APK_SHA="$(sha256sum build-artifact/PII-Pilot-V2.apk | cut -d ' ' -f1)"
          cat > build-artifact/build-identity.json <<EOF
          {
            "schema_version": 1,
            "artifact_kind": "standalone_pilot_apk",
            "build_variant": "release",
            "application_id": "com.jancoo.piireviewerpilotv2",
            "version_name": "0.1.1",
            "version_code": 2,
            "git_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "workflow_run_attempt": "${GITHUB_RUN_ATTEMPT}",
            "apk_sha256": "${APK_SHA}"
          }
          EOF
      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pii-pilot-v2-${{ github.sha }}
          path: mobile/pii-reviewer/build-artifact/
          if-no-files-found: error
          retention-days: 14
