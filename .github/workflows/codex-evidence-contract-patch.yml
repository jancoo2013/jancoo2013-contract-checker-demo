name: Temporary evidence detector contract update

on:
  pull_request:
    types: [opened]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/evidence-based-pii-detector-contract-v0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply binding documentation update
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python tools/codex_evidence_contract_patch.py

      - name: Validate documentation and state
        run: |
          python -m json.tool docs/OCR_PROJECT_STATE.json > /dev/null
          grep -F 'Page position alone is never sufficient evidence' docs/PII_EVIDENCE_DETECTOR_V1.md
          grep -F 'pii-candidate-evidence-schema-v0' docs/OCR_PROJECT_STATE.md
          grep -F 'evidence-based-pii-detector-contract-v0' docs/OCR_PROJECT_STATE.json
          grep -F 'docs/PII_EVIDENCE_DETECTOR_V1.md' docs/ARCHITECTURE.md
          grep -F 'marker_layout_baseline_v0' docs/CUSTOM_OCR_PIPELINE.md
          git diff --check

      - name: Commit binding contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PII_EVIDENCE_DETECTOR_V1.md docs/ARCHITECTURE.md docs/CUSTOM_OCR_PIPELINE.md docs/OCR_PROJECT_STATE.md docs/OCR_PROJECT_STATE.json tools/codex_evidence_contract_patch.py
          git commit -m "Define evidence-based PII detector contract"
          git push origin HEAD:agent/evidence-based-pii-detector-contract-v0
