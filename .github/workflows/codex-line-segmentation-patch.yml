name: Temporary line segmentation corrective

on:
  push:
    branches:
      - agent/line-segmentation-giant-band-guard-v0
    paths:
      - .github/workflows/codex-line-segmentation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/line-segmentation-giant-band-guard-v0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded corrective
        run: python tools/codex_line_segmentation_patch.py

      - name: Validate corrective
        run: |
          python -m pip install -r research/hebrew_contract_ocr/requirements-training.txt
          python -m py_compile research/hebrew_contract_ocr/line_segmenter.py
          python -m unittest tests.test_ocr_line_segmenter
          git diff --check

      - name: Commit bounded change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Guard line segmentation against giant bands"
          git push origin HEAD:agent/line-segmentation-giant-band-guard-v0
